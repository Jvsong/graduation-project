# 商品搜索测试数据
search_test_cases:
  # 关键词搜索
  - search_keyword: "手机"
    expected_results: ["智能手机"]
    min_results: 1

  - search_keyword: "电脑"
    expected_results: ["笔记本电脑"]
    min_results: 1

  - search_keyword: "T恤"
    expected_results: ["男士T恤"]
    min_results: 1

  # 模糊搜索
  - search_keyword: "智能"
    expected_results: ["智能手机"]
    min_results: 1

  - search_keyword: "笔记本"
    expected_results: ["笔记本电脑"]
    min_results: 1

  # 无结果搜索
  - search_keyword: "不存在商品"
    expected_results: []
    min_results: 0

# 商品筛选测试数据
filter_test_cases:
  # 价格范围筛选
  - filter_type: "price_range"
    min_price: 0
    max_price: 100
    expected_products: ["男士T恤"]

  - filter_type: "price_range"
    min_price: 2000
    max_price: 4000
    expected_products: ["智能手机"]

  # 分类筛选
  - filter_type: "category"
    category_id: 1
    expected_products: ["智能手机", "笔记本电脑"]

  - filter_type: "category"
    category_id: 2
    expected_products: ["男士T恤", "女士连衣裙"]

  # 状态筛选
  - filter_type: "status"
    status: "上架"
    expected_products: ["智能手机", "笔记本电脑", "男士T恤", "女士连衣裙"]

  - filter_type: "status"
    status: "下架"
    expected_products: []

  # 热门商品筛选
  - filter_type: "is_hot"
    value: true
    expected_products: ["智能手机", "笔记本电脑", "女士连衣裙"]

  # 新品筛选
  - filter_type: "is_new"
    value: true
    expected_products: ["智能手机", "男士T恤"]

# 商品排序测试数据
sort_test_cases:
  - sort_by: "price_asc"
    expected_first_product: "男士T恤"
    description: "价格从低到高"

  - sort_by: "price_desc"
    expected_first_product: "笔记本电脑"
    description: "价格从高到低"

  - sort_by: "sales_desc"
    expected_first_product: "智能手机"
    description: "销量从高到低"

  - sort_by: "stock_desc"
    expected_first_product: "男士T恤"
    description: "库存从高到低"

  - sort_by: "create_time_desc"
    expected_first_product: "女士连衣裙"  # 假设最新创建
    description: "创建时间从新到旧"

# 商品操作测试数据（新增、编辑、删除）

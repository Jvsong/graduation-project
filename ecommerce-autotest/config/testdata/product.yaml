# 商品导入/导出测试数据
import_export_test:
  import_file:
    path: "./test_data/products_import.xlsx"
    format: "excel"
    expected_count: 10

  export_formats: ["excel", "csv", "pdf"]
  export_columns: ["ID", "名称", "分类", "价格", "库存", "状态"]

# 商品验证规则
validation_rules:
  name:
    required: true
    min_length: 2
    max_length: 100

  price:
    required: true
    min_value: 0.01
    max_value: 999999.99
    decimal_places: 2

  stock:
    required: true
    min_value: 0
    max_value: 999999

  sku:
    required: true
    pattern: "^[A-Z0-9-]+$"
    max_length: 50

# 边界测试数据
boundary_test_cases:
  # 商品名称边界
  - name: "a"  # 最小长度
    expected_valid: true
    description: "商品名称最小长度"

  - name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"  # 最大长度
    expected_valid: true
    description: "商品名称最大长度"

  - name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"  # 超出最大长度
    expected_valid: false
    expected_error: "商品名称不能超过100个字符"
    description: "商品名称超出最大长度"

  # 价格边界
  - price: 0.01  # 最小价格
    expected_valid: true
    description: "最小价格"

  - price: 999999.99  # 最大价格
    expected_valid: true
    description: "最大价格"

  - price: 0  # 零价格
    expected_valid: false
    expected_error: "价格必须大于0"
    description: "零价格"

  - price: 1000000  # 超出最大价格
    expected_valid: false
    expected_error: "价格不能超过999999.99"
    description: "超出最大价格"

  # 库存边界
  - stock: 0  # 零库存
    expected_valid: true
    description: "零库存"

  - stock: 999999  # 最大库存
    expected_valid: true
    description: "最大库存"

  - stock: -1  # 负库存
    expected_valid: false
    expected_error: "库存不能为负数"
    description: "负库存"

# 性能测试数据
performance_test:
  bulk_operations:
    product_count: 1000
    batch_size: 100
    expected_time: 30  # 秒

  search_performance:
    keyword: "测试"
    expected_response_time: 2  # 秒

# 测试用例分组
test_case_groups:
  smoke_test:
    - "search_test_cases[0]"  # 基本搜索
    - "filter_test_cases[0]"  # 基本筛选
    - "operation_test_cases.new_product"  # 新增商品

  regression_test:
    - "search_test_cases"
    - "filter_test_cases"
    - "sort_test_cases"
    - "operation_test_cases"
    - "sku_test_cases"

  security_test:
    - "boundary_test_cases"
    - "validation_rules"

  performance_test:
    - "performance_test"

# 页面元素定位器
page_elements:
  # 商品列表页面
  product_list:
    search_input: { by: "id", value: "product-search" }
    search_button: { by: "id", value: "search-btn" }
    category_filter: { by: "id", value: "category-filter" }
    price_filter: { by: "id", value: "price-filter" }
    product_table: { by: "id", value: "product-table" }
    add_product_button: { by: "id", value: "add-product-btn" }

  # 商品表单页面
  product_form:
    name_input: { by: "id", value: "product-name" }
    category_select: { by: "id", value: "product-category" }
    price_input: { by: "id", value: "product-price" }
    stock_input: { by: "id", value: "product-stock" }
    description_textarea: { by: "id", value: "product-description" }
    save_button: { by: "id", value: "save-btn" }
    cancel_button: { by: "id", value: "cancel-btn" }

  # 新增商品
  new_product:
    name: "测试商品_{timestamp}"
    category_id: 3
    sku: "TEST-{random}"
    price: 199.99
    stock: 50
    description: "这是一个测试商品"
    status: "上架"

  # 编辑商品
  edit_product:
    product_id: 1001  # 智能手机
    updates:
      price: 2799.99
      stock: 120
      description: "更新后的智能手机描述"

  # 删除商品
  delete_product:
    product_id: 1002  # 笔记本电脑
    confirm_message: "确定要删除这个商品吗？"

  # 批量操作
  batch_operations:
    select_all: false
    selected_products: [1001, 2001]  # 智能手机和男士T恤
    operation: "下架"
    confirm_message: "确定要下架选中的商品吗？"

# 商品SKU测试数据

# 订单管理模块测试数据

# 订单状态定义
order_status:
  pending_payment: "待付款"
  paid: "已付款"
  pending_shipment: "待发货"
  shipped: "已发货"
  delivered: "已送达"
  completed: "已完成"
  cancelled: "已取消"
  refunded: "已退款"

# 测试订单数据
test_orders:
  # 待付款订单
  - order_id: "ORDER-20240404-001"
    user_id: 1001
    username: "customer1"
    order_time: "2024-04-04 10:30:00"

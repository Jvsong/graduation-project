    total_amount: 89.99
    status: "pending_shipment"
    payment_method: "wechat_pay"
    payment_time: "2024-04-04 11:20:00"
    items:
      - product_id: 2001
        product_name: "男士T恤"
        quantity: 1
        price: 89.99
        subtotal: 89.99

  # 已发货订单
  - order_id: "ORDER-20240403-001"

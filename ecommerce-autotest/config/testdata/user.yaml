# 用户权限测试数据
permission_test_cases:
  # 角色权限分配
  role_permissions:
    admin:
      permissions: ["all"]
      description: "管理员拥有所有权限"

    operator:
      permissions: ["product_manage", "order_manage", "user_view"]
      description: "操作员可以管理商品和订单，查看用户"

    customer_service:
      permissions: ["order_view", "order_edit", "customer_manage"]
      description: "客服可以查看和编辑订单，管理客户"

    viewer:
      permissions: ["product_view", "order_view", "user_view"]
      description: "查看员只能查看信息，不能修改"

  # 权限验证测试
  permission_verification:
    - username: "operator1"
      role: "operator"
      allowed_actions: ["查看商品列表", "编辑商品", "查看订单", "发货订单"]
      denied_actions: ["删除用户", "修改系统设置", "查看财务报表"]

    - username: "service1"
      role: "customer_service"
      allowed_actions: ["查看订单详情", "处理退款", "回复客户咨询"]
      denied_actions: ["编辑商品信息", "修改用户权限", "导出财务报表"]

# 性能测试数据
performance_test:
  bulk_operations:
    user_count: 1000
    batch_size: 100
    expected_time: 30  # 秒

  search_performance:
    keyword: "test"
    expected_response_time: 2  # 秒

# 测试用例分组
test_case_groups:
  smoke_test:
    - "search_test_cases[0]"  # 基本搜索
    - "filter_test_cases[0]"  # 基本筛选
    - "operation_test_cases.new_user"  # 新增用户

  regression_test:
    - "search_test_cases"
    - "filter_test_cases"
    - "operation_test_cases"
    - "validation_rules"

  security_test:
    - "boundary_test_cases"
    - "validation_rules"

  performance_test:
    - "performance_test"

